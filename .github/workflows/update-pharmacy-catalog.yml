name: Update pharmacy catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'
  push:
    paths:
      - '.github/workflows/update-pharmacy-catalog.yml'
      - 'scripts/update_pharmacy_catalog.py'
      - 'scripts/catalog-regions.json'

permissions:
  contents: write

concurrency:
  group: pharmacy-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate complete OSM data
        run: python scripts/update_pharmacy_catalog.py
      - name: Commit generated catalog to the current branch
        env:
          CATALOG_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/pharmacies/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh static pharmacy catalog'
          git pull --rebase origin "$CATALOG_BRANCH"
          git push origin "HEAD:$CATALOG_BRANCH"
