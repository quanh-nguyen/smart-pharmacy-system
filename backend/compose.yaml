services:
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run init:local first}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-smart_pharmacy}
      MYSQL_USER: ${MYSQL_USER:-smart_pharmacy}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run init:local first}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -u $$MYSQL_USER --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  mysql_data:
