<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhà Thuốc Thông Minh - Tìm Thuốc & Hiệu Thuốc Gần Nhất</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header class="topbar">
            <h1>🏥 Nhà Thuốc Thông Minh</h1>
            <p>Tìm thuốc & định vị hiệu thuốc gần nhất</p>
        </header>

        <section class="hero">
            <div class="card">
                <h2>Tìm Kiếm Thuốc</h2>
                <p>Tìm thuốc theo tên, công dụng hoặc thành phần</p>
                <a href="/search" class="btn btn-primary">🔍 Tìm Kiếm</a>
            </div>
            <div class="card">
                <h2>Định Vị Hiệu Thuốc</h2>
                <p>Xem bản đồ hiệu thuốc gần nhất & đường đi ngắn nhất</p>
                <a href="/map" class="btn btn-primary">🗺️ Xem Bản Đồ</a>
            </div>
        </section>

        <section class="stats">
            <div class="stat-card">
                <p>Tổng Thuốc</p>
                <h2>5+</h2>
            </div>
            <div class="stat-card">
                <p>Hiệu Thuốc</p>
                <h2>4</h2>
            </div>
            <div class="stat-card">
                <p>Trạng Thái</p>
                <h2>Hoạt Động</h2>
            </div>
        </section>
    </div>
</body>
</html>
